<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병원 가는 길 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap">
<style>
/* Layout: one narrow column, a registration-slip (挂号单) card that appears after a 4-digit code */
:root{
  --bg:#eef1f3; --paper:#ffffff; --ink:#1d2a33; --muted:#5d6b75;
  --line:#c9d2d8; --accent:#1f5f8b; --stamp:#b8402f; --wash:#e3edf4;
  --f-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-head:"Noto Serif SC","Songti SC",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181d; --paper:#1b242b; --ink:#e4ebf0; --muted:#9aa8b2;
  --line:#33424d; --accent:#7fb6dc; --stamp:#e2826f; --wash:#22313b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181d; --paper:#1b242b; --ink:#e4ebf0; --muted:#9aa8b2;
  --line:#33424d; --accent:#7fb6dc; --stamp:#e2826f; --wash:#22313b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-kr);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-kr);font-size:22px;font-weight:700;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
label{font-weight:500}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:700 28px/1 var(--f-cn);letter-spacing:.35em;text-align:center;padding:12px 8px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--accent)}
button{font:500 16px var(--f-kr);border:0;border-radius:8px;padding:0 20px;background:var(--accent);color:var(--paper);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--stamp);font-size:14px;min-height:1.2em;margin:0}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.slip-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px;background:var(--wash);border-bottom:1px dashed var(--line)}
.slip-top .kind{font:700 13px var(--f-kr);letter-spacing:.08em;color:var(--accent)}
.slip-top .time{font:500 13px var(--f-cn);color:var(--muted);font-variant-numeric:tabular-nums}
.slip-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.role{display:flex;align-items:center;gap:12px}
.role h2{font:700 26px/1.2 var(--f-head);margin:0}
.role span{font-size:15px;color:var(--muted)}
.stamp{margin-left:auto;border:2px solid var(--stamp);color:var(--stamp);font:700 13px var(--f-cn);padding:2px 8px;border-radius:4px;transform:rotate(-6deg);white-space:nowrap}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{font-family:var(--f-cn);font-size:18px;line-height:1.55;padding-left:16px;position:relative}
li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
li .sub{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.ko{display:block;font-family:var(--f-kr);font-size:14px;color:var(--muted)}
.words{border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.words b{font-family:var(--f-cn);color:var(--ink);font-weight:500}
.ask{font:500 17px var(--f-cn);color:var(--stamp)}
.rule{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding:12px 20px;margin:0}
.again{align-self:flex-start;background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:10px 16px}
@media (prefers-reduced-motion:no-preference){.slip{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick.seat{grid-template-columns:repeat(4,1fr)}
.pick button{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:14px 0;font:700 20px var(--f-kr)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.open{padding:14px;font-size:17px}
.open:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:0}
.link{background:none;color:var(--muted);padding:0;font-size:14px;text-decoration:underline;align-self:center}
.mission,.secret{border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mission{background:var(--wash)}
.secret{border:1.5px dashed var(--stamp)}
.m-head{font:700 15px var(--f-cn);color:var(--accent)}
.secret .m-head{color:var(--stamp)}
.ko-i{font:400 12px var(--f-kr);color:var(--muted);margin-left:4px}
.mission p,.secret p{margin:0;font:500 16px/1.55 var(--f-cn)}
.mission .big{font-size:20px;font-weight:700}
.mission .ok{font-size:14px;font-weight:400}
.mission .ko,.secret .ko{font-size:12.5px;margin-top:2px}
.decide{display:flex;flex-direction:column;gap:12px}
.decide h3{margin:0;font:700 17px var(--f-cn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:9px 14px;font:500 16px var(--f-cn);border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.res{display:flex;flex-direction:column;gap:10px}
.verdict{font:700 24px var(--f-cn);margin:0}
.verdict.ok{color:var(--accent)} .verdict.no{color:var(--stamp)}
.line{margin:0;font:400 16px/1.5 var(--f-cn)}
.line .ko{font-size:13px}
.sm{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:15px;align-items:baseline}
.sm b{font-family:var(--f-cn)}
.go{background:var(--stamp)}
#vbanner .secret{background:var(--paper);border-width:2.5px}
#vbanner .m-head{font-size:18px}
@media (prefers-reduced-motion:no-preference){#vbanner:not([hidden]){animation:pop .5s ease-out}@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}}
.code{display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--wash);border-radius:8px;padding:12px}
.code b{font:700 24px var(--f-cn);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:center}
.rv{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rv.me{border-color:var(--accent);border-width:2px}
.rv-h{display:flex;align-items:center;gap:8px;font-family:var(--f-cn)}
.rv p{margin:0;font:400 15px/1.5 var(--f-cn)}
.rv .ko{font-size:12.5px}
.tag{background:var(--accent);color:var(--paper);font:700 12px var(--f-kr);padding:1px 7px;border-radius:999px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>병원 가는 길 카드</h1>
    <p>모둠 번호와 자리를 고르면 내 역할 카드가 열립니다.</p>
  </header>

  <div id="vbanner" hidden></div>
  <div id="team"></div>
  <section class="panel" id="picker">
    <label>① 모둠 번호</label>
    <div class="pick" id="groups"></div>
    <label>② 내 자리 <span class="hint">(가위바위보로 정하세요. '라'는 4명 모둠만)</span></label>
    <div class="pick seat" id="seats"></div>
    <button type="button" class="open" id="openRole" disabled>내 카드 열기</button>
    <button type="button" class="link" id="toCode">선생님이 알려 준 번호로 열기</button>
  </section>

  <section class="panel decide" id="decide" hidden>
    <h3>去哪个医院？<span class="ko-i">어느 병원</span></h3><div class="chips" id="dH"></div>
    <h3>怎么去？<span class="ko-i">무엇을 타고</span></h3><div class="chips" id="dT"></div>
    <h3>谁陪 A 去？<span class="ko-i">누가 같이</span></h3><div class="chips" id="dC"></div>
    <h3>变化卡 <span class="ko-i">모둠이 받은 변수 카드</span></h3><div class="chips" id="dV"></div>
    <button type="button" class="open" id="calc" disabled>结果是…？ 결과 보기</button>
    <div class="res" id="res" hidden></div>
    <button type="button" class="link" id="backPick">내 카드로 돌아가기</button>
  </section>

  <form class="panel" id="form" autocomplete="off" hidden>
    <label for="code">카드 번호</label>
    <div class="row">
      <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" aria-describedby="err">
      <button type="submit" id="go">열기</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button type="button" class="link" id="toPick">모둠·자리로 고르기</button>
  </form>

  <div id="out" hidden></div>
</div>

<script>
const RULE='卡片不能给别人看，只能用汉语说。<span class="ko">카드를 보여 주지 말고, 중국어로만 말하세요.</span>';
const TEAM='<div class="mission"><div class="m-head">小组任务 <span class="ko-i">모둠 미션</span></div><p class="big">让 A 今天见到医生。<span class="ko">A가 오늘 의사를 만나게 하라.</span></p></div>';
document.getElementById('team').innerHTML=TEAM;
const ASK='请再想一想：你们的决定要改吗？<span class="ko">결정을 바꿔야 할까요?</span>';
const CARDS={
 "2718":{kind:"角色卡 1 · 역할 카드",role:"病人",ko:"환자",name:"A",items:[
   "我是 A，是留学生。","我发烧，头疼。","吃了药，但是没有好转。","我汉语不太好，怕听不懂医生的话。","我钱包里只有 20 块钱。","我今天一定要看病。"],words:[["留学生","유학생"]],rule:true,secret:["你不想一个人去医院。让一个人陪你去！","혼자 병원에 가기 싫다. 누군가가 같이 가 주게 만들어라!"]},
 "3142":{kind:"角色卡 2 · 역할 카드",role:"朋友",ko:"친구",name:"B",items:[
   "我是 B，是 A 的中国朋友。","我五点有汉语课，不能迟到。",
   '我有地图：<span class="sub">小医院：走路 20 分钟，打车 5 分钟</span><span class="sub">大医院：打车 20 分钟，坐公交车 40 分钟</span>',
   "我想帮 A，可是汉语课也很重要。"],words:[["公交车","버스"]],rule:true,secret:["帮 A 去看病，可是五点的汉语课一定不能迟到！","A가 진료받게 돕되, 5시 수업에는 절대 늦지 마라!"]},
 "1618":{kind:"角色卡 3 · 역할 카드",role:"宿舍管理员",ko:"기숙사 관리인",name:"C",items:[
   "我是 C，是宿舍管理员。","小医院：四点停止看病，没有翻译。","大医院：六点停止看病，有韩语翻译。",
   "打车：到小医院 10 块，到大医院 35 块。","坐公交车：2 块。"],words:[["停止看病","진료 마감"],["翻译","통역"],["说服","설득하다"]],rule:true,secret:["你觉得大医院最好，因为有翻译。说服大家去大医院！","큰 병원이 가장 좋다고 생각한다(통역이 있으니까). 모두가 큰 병원에 가도록 설득하라!"]},
 "4271":{kind:"角色卡 4 · 확장 카드 (4명 모둠)",role:"室友",ko:"룸메이트",name:"D",items:[
   "我是 D，是 A 的室友。","我会说一点儿韩语。",
   '学校里有校医院：<span class="sub">走路 10 分钟，五点停止看病，不要钱。</span><span class="sub">可是今天人很多，要等一个小时。</span>',
   "我有自行车，骑车到小医院 10 分钟。",
   "我六点要去打工，不能晚。"],words:[["室友","룸메이트"],["校医院","교내 병원"],["骑车","자전거를 타다"],["打工","아르바이트하다"],["说服","설득하다"]],rule:true,secret:["你觉得校医院最好，因为不要钱。说服大家去校医院！","교내 병원이 가장 좋다고 생각한다(돈이 안 드니까). 모두가 교내 병원에 가도록 설득하라!"]},
 "5301":{kind:"变化卡 1 · 변수 카드",role:"堵车",ko:"교통 체증",stamp:"变化",items:[
   '路上堵车，打车要多 15 分钟。<span class="ko">길이 막혀서 택시가 15분 더 걸립니다.</span>'],words:[["堵车","길이 막히다"]],ask:true},
 "6420":{kind:"变化卡 2 · 변수 카드",role:"取消",ko:"수업 취소",stamp:"变化",items:[
   'B 的汉语课取消了。<span class="ko">B의 중국어 수업이 취소되었습니다.</span>'],words:[["取消","취소하다"]],ask:true},
 "7539":{kind:"变化卡 3 · 변수 카드",role:"下雨",ko:"비",stamp:"变化",items:[
   '下雨了，公交车很慢，要多 20 分钟。<span class="ko">비가 와서 버스가 20분 더 걸립니다.</span>'],ask:true},
 "8648":{kind:"变化卡 4 · 변수 카드",role:"借钱",ko:"돈 빌리기",stamp:"变化",items:[
   '宿舍管理员可以借 A 20 块钱。<span class="ko">관리인이 A에게 20위안을 빌려줄 수 있습니다.</span>'],words:[["借","빌려주다"]],ask:true}
};
const VAR={"A":"5301","B":"6420","C":"7539","D":"8648"};
const PERMS=[["2718","3142","1618"],["3142","1618","2718"],["1618","2718","3142"],["2718","1618","3142"],["3142","2718","1618"],["1618","3142","2718"]];
const $=id=>document.getElementById(id);
const picker=$('picker'),form=$('form'),input=$('code'),err=$('err'),out=$('out');
let group=null,seat=null,lastCode=null;
function buttons(box,labels,onPick){labels.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{[...box.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');onPick(i);});box.appendChild(b);});}
buttons($('groups'),['1','2','3','4','5','6','7','8'],i=>{group=i;ready();});
buttons($('seats'),['가','나','다','라'],i=>{seat=i;ready();});
function ready(){$('openRole').disabled=!(group!==null&&seat!==null);}
$('openRole').addEventListener('click',()=>{show(seat===3?'4271':PERMS[group%6][seat],picker);armVariable(group+1,seat);});
$('toCode').addEventListener('click',()=>{picker.hidden=true;form.hidden=false;input.focus();});
$('toPick').addEventListener('click',()=>{form.hidden=true;picker.hidden=false;});
input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,4);err.textContent='';});
form.addEventListener('submit',e=>{e.preventDefault();
  if(!CARDS[input.value]){err.textContent=input.value.length<4?'번호 4자리를 모두 넣어 주세요.':'없는 번호입니다. 다시 확인해 주세요.';return;}
  show(input.value,form);});
function show(code,from){const c=CARDS[code];
  out.innerHTML=`<article class="slip">
    <div class="slip-top"><span class="kind">${c.kind}</span><span class="time">现在 下午 3:50</span></div>
    <div class="slip-body">
      <div class="role"><h2>${c.role}</h2><span>${c.name?c.name+" · ":""}${c.ko}</span><span class="stamp">${c.stamp||'角色'}</span></div>
      <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
      ${c.words?`<div class="words">生词 · ${c.words.map(w=>`<b>${w[0]}</b> ${w[1]}`).join(' / ')}</div>`:''}
      ${c.ask?`<div class="ask">${ASK}</div>`:''}
      ${c.secret?`<div class="secret"><div class="m-head">秘密任务 <span class="ko-i">비밀 미션 · 다른 사람에게 말하지 마세요</span></div><p>${c.secret[0]}<span class="ko">${c.secret[1]}</span></p></div>`:''}
    </div>
    ${c.rule?`<p class="rule">${RULE}</p>`:''}
  </article>
  ${c.secret?'<button type="button" class="open go" id="decideBtn">我们决定了！ 결정 입력하기</button>':''}
  <button type="button" class="again" id="again">처음으로</button>`;
  lastCode=code;picker.hidden=true;form.hidden=true;out.hidden=false;$('team').hidden=true;
  if($('decideBtn'))$('decideBtn').addEventListener('click',()=>{out.hidden=true;$('decide').hidden=false;$('team').hidden=false;window.scrollTo({top:0});});
  $('again').addEventListener('click',()=>{out.hidden=true;out.innerHTML='';picker.hidden=false;$('team').hidden=false;input.value='';
    if(location.hash){history.replaceState(null,'',location.pathname);}});}
function fromHash(){const k=location.hash.replace('#','');if(VAR[k])show(VAR[k]);}
window.addEventListener('hashchange',fromHash);fromHash();

/* ---- 시간이 지나면 변수 카드 자동 표시 ---- */
const MINUTES=(()=>{const m=location.hash.match(/^#t(\d+)$/);return m?+m[1]:10;})();
const today=new Date().toISOString().slice(0,10);
function seedOf(g){let h=g*131;for(const ch of today)h=(h*31+ch.charCodeAt(0))%100003;return h;}
function varFor(g){const h=seedOf(g);return {card:String(1+h%4),seat:Math.floor(h/7)%3};}
let vtimer=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function armVariable(g,st){
  const plan=varFor(g); if(st!==plan.seat) return;
  const key=`hc-${today}-${g}-${st}`;let start=+store(key);
  if(!start){start=Date.now();store(key,String(start));}
  clearTimeout(vtimer);
  const wait=Math.max(0,start+MINUTES*60000-Date.now());
  vtimer=setTimeout(()=>fireVariable(plan.card),wait);
}
function fireVariable(v){const c=CARDS[VCODE[v]];
  $('vbanner').innerHTML=`<div class="secret"><div class="m-head">变化卡来了！ <span class="ko-i">변수 카드가 도착했어요 · 모둠에 중국어로 알리세요</span></div>
    <div class="ko-i" style="margin:0">${c.kind}</div><p>${c.items[0]}</p></div>`;
  $('vbanner').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
  try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
}

/* ---- 결정 → 결과 ---- */
const HOSP={small:{cn:"小医院",close:10,r:{walk:[20,0],taxi:[5,10],bike:[10,0]}},
            big:{cn:"大医院",close:130,trans:true,r:{taxi:[20,35],bus:[40,2]}},
            school:{cn:"校医院",close:70,r:{walk:[10,0]}}};
const TR={walk:"走路",taxi:"打车",bus:"坐公交车",bike:"骑车"};
const WHO={alone:"一个人去",B:"B",C:"C",D:"D"};
const VCODE={"1":"5301","2":"6420","3":"7539","4":"8648"};
const sel={h:null,t:null,c:null,v:"0"};
function chips(box,obj,key,pre){Object.entries(obj).forEach(([k,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',String(k===pre));
  b.addEventListener('click',()=>{[...box.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');sel[key]=k;
  $('res').hidden=true;$('calc').disabled=!(sel.h&&sel.t&&sel.c);});box.appendChild(b);});}
chips($('dH'),{small:"小医院",big:"大医院",school:"校医院"},'h');
chips($('dT'),TR,'t');chips($('dC'),WHO,'c');
chips($('dV'),{"0":"没有","1":"1 堵车","2":"2 取消","3":"3 下雨","4":"4 借钱"},'v',"0");
const clock=m=>{const t=15*60+50+m;return `下午 ${Math.floor(t/60)-12}:${String(t%60).padStart(2,'0')}`;};
const L=(cn,ko)=>`<p class="line">${cn}<span class="ko">${ko}</span></p>`;
$('calc').addEventListener('click',()=>{
  const H=HOSP[sel.h],r=H.r[sel.t],v=sel.v;
  if(!r){show2(`<p class="verdict no">没有这条路的信息。</p>`+L('请再看看大家的卡片。','카드에 이 길(병원+교통수단)에 대한 정보가 없어요. 다시 확인해 보세요.'));return;}
  let [min,cost]=r,ok=true;const lines=[];
  if(sel.t==='taxi'&&v==='1')min+=15;
  if(sel.t==='bus'&&v==='3')min+=20;
  const money=20+(v==='4'?20:0);
  if(min<H.close) lines.push(L(`${clock(min)} 到${H.cn}，${H.cn}${clock(H.close)}停止看病，来得及。`,'마감 전에 도착합니다.'));
  else {ok=false;lines.push(L(`${clock(min)} 到${H.cn}，可是${H.cn}${clock(H.close)}停止看病，来不及了。`,'마감 시간에 늦었습니다.'));}
  if(cost<=money) lines.push(L(cost?`${TR[sel.t]}要 ${cost} 块，A 有 ${money} 块，钱够。`:'不要钱。',cost?'돈이 충분합니다.':'돈이 들지 않습니다.'));
  else {ok=false;lines.push(L(`${TR[sel.t]}要 ${cost} 块，可是 A 只有 ${money} 块，钱不够。`,'돈이 모자랍니다.'));}
  if(ok){ if(H.trans) lines.push(L('医院有韩语翻译，A 听得懂医生的话。','통역이 있어 A가 의사 말을 알아듣습니다.'));
    else if(sel.c!=='alone') lines.push(L(`${sel.c} 陪 A，帮 A 听医生的话。`,`${sel.c}가 옆에서 도와줍니다.`));
    else lines.push(L('没有翻译，也没有人陪，A 听不太懂医生的话。','통역도 동행도 없어 A가 의사 말을 잘 못 알아듣습니다.'));}
  const bLate=sel.c==='B'&&sel.h!=='small'&&v!=='2';
  const RC={A:"2718",B:"3142",C:"1618",D:"4271"};
  const done={A:sel.c!=='alone',B:!bLate,C:sel.h==='big',D:sel.h==='school'};
  const HS={small:"小",big:"大",school:"校"},TS={walk:"走",taxi:"打车",bus:"公交",bike:"骑"};
  const codeStr=`${HS[sel.h]} · ${TS[sel.t]} · ${sel.c==='alone'?'一人':sel.c+'陪'} · ${v==='0'?'无':'变'+v}`;
  const reveal=Object.entries(RC).map(([w,code])=>{const c=CARDS[code];const me=code===lastCode;
    return `<div class="rv${me?' me':''}"><div class="rv-h"><b>${done[w]?'✓':'✗'} ${w} ${c.role}</b>${me?'<span class="tag">나</span>':''}${w==='D'?'<span class="ko-i">4명 모둠</span>':''}</div>
      <p>${c.secret[0]}<span class="ko">${c.secret[1]}</span></p></div>`;}).join('');
  show2(`<div class="code"><span class="ko-i">결정 코드 · 모둠원과 화면을 맞대 보세요</span><b>${codeStr}</b></div>
    <p class="verdict ${ok?'ok':'no'}">${ok?'A 见到医生了！':'A 没见到医生。'}</p>
    <span class="ko">${ok?'모둠 미션 성공!':'모둠 미션 실패.'}</span>${lines.join('')}
    <div class="m-head">秘密任务公开 <span class="ko-i">모두의 비밀 미션 공개 · 이건 게임이었어요!</span></div>
    ${reveal}`);
});
function show2(html){$('res').innerHTML=html;$('res').hidden=false;$('res').scrollIntoView({behavior:'smooth',block:'nearest'});}
$('backPick').addEventListener('click',()=>{$('res').hidden=true;$('decide').hidden=true;show(lastCode);});
</script>
</body>
</html>
